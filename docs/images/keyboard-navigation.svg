<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Browse files with the arrow keys</title><desc id="desc">Illustration of Up and Down arrow keys for navigating files and an Escape key for closing the preview.</desc>
<rect width="900" height="430" rx="24" fill="#101821"/><circle cx="808" cy="67" r="104" fill="#1c3440" opacity=".45"/>
<text x="56" y="75" fill="#8cdcb9" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">QUICK PREVIEW</text>
<text x="56" y="132" fill="#f5f8f7" font-family="Segoe UI,Arial,sans-serif" font-size="36" font-weight="600">Browse without breaking flow</text>
<text x="56" y="177" fill="#b9c8cc" font-family="Segoe UI,Arial,sans-serif" font-size="20">Move between files, then close the preview with Esc.</text>
<rect x="56" y="216" width="788" height="156" rx="14" fill="#202b34" stroke="#40505a"/>
<rect x="100" y="246" width="65" height="65" rx="8" fill="#33434c" stroke="#70828b"/><text x="132" y="290" text-anchor="middle" fill="#f5f8f7" font-family="Segoe UI Symbol,Segoe UI,Arial,sans-serif" font-size="31">↑</text>
<rect x="178" y="246" width="65" height="65" rx="8" fill="#33434c" stroke="#70828b"/><text x="210" y="290" text-anchor="middle" fill="#f5f8f7" font-family="Segoe UI Symbol,Segoe UI,Arial,sans-serif" font-size="31">↓</text>
<text x="100" y="345" fill="#b9c8cc" font-family="Segoe UI,Arial,sans-serif" font-size="18">Previous / next file</text>
<rect x="590" y="246" width="95" height="65" rx="8" fill="#33434c" stroke="#70828b"/><text x="637" y="288" text-anchor="middle" fill="#f5f8f7" font-family="Segoe UI,Arial,sans-serif" font-size="22">Esc</text><text x="590" y="345" fill="#b9c8cc" font-family="Segoe UI,Arial,sans-serif" font-size="18">Close preview</text>
<text x="56" y="405" fill="#91a4a9" font-family="Segoe UI,Arial,sans-serif" font-size="15">Illustration · Space also closes the preview</text>
</svg>

