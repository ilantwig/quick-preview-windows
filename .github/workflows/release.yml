name: Publish Windows release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verified LLVM-MinGW
        shell: pwsh
        run: ./scripts/setup-toolchain.ps1
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Package and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'dist/QuickPreview-Windows-x64'
          New-Item -ItemType Directory -Force $bundle | Out-Null
          Copy-Item 'dist/QuickPreview.exe', 'README.md', 'LICENSE.txt', 'THIRD_PARTY_NOTICES.md' $bundle
          Copy-Item 'ThirdPartyLicenses' $bundle -Recurse
          Compress-Archive -Path "$bundle/*" -DestinationPath 'dist/QuickPreview-Windows-x64.zip'
          $hash = (Get-FileHash 'dist/QuickPreview-Windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  QuickPreview-Windows-x64.zip" | Set-Content -Encoding ascii 'dist/SHA256SUMS.txt'
          gh release view v1.0.0 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release v1.0.0 already exists. Create a new version rather than replacing it.' }
          gh release create v1.0.0 'dist/QuickPreview-Windows-x64.zip' 'dist/SHA256SUMS.txt' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Quick Preview 1.0 — Native Win32' --notes 'Native C++/Win32 x64 preview for Windows 10 and 11. Extract the ZIP and run QuickPreview.exe. PDF preview requires a registered Windows PDF preview handler. This build is unsigned.'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }

